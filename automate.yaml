name: robo-erp
requires:
  - python>=3.11
setup: python -m pip install -r requirements.txt
run: python robo.py
interactive: true
timeout: 15m
params:
  - name: sistema
    description: Endereço do ERP
    default: https://xzmuh.github.io/gestao-pro/
  - name: usuario
    description: Usuário do ERP
    default: robo
  - name: senha
    description: Senha do ERP
    default: next123
